name: integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind (Kubernetes ${{ matrix.minor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The five newest stable minors; see docs/compatibility.md.
        # Node images are pinned by digest, as kind recommends.
        include:
          - minor: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - minor: "1.36"
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - minor: "1.35"
            image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - minor: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - minor: "1.33"
            image: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          node_image: ${{ matrix.image }}
          cluster_name: k8s-axi
      - name: integration tests
        env:
          K8S_AXI_EXPECT_MINOR: ${{ matrix.minor }}
        run: go test -tags integration -count=1 ./...
