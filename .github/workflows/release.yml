name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # semantic-release computes the version and pushes the tag, then its
        # exec plugin runs goreleaser, which builds the archives and publishes
        # the GitHub Release (see .releaserc.json).
        # Pin the preset: conventionalcommits@10 needs conventional-changelog-writer@9+,
        # which semantic-release@25 does not ship, so release notes fail with "Missing helper".
        run: >
          npx --yes
          -p semantic-release@25
          -p conventional-changelog-conventionalcommits@9.3.1
          -p @semantic-release/exec
          semantic-release
